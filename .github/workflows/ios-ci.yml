name: iOS CI (Kotlin/Native)

# The only place the Apple side can actually be checked.
#
# Klibs for iosArm64 / iosSimulatorArm64 cross compile on any host, so a developer on Windows or
# Linux already knows the shared code COMPILES for iOS. What no other machine can do is RUN it:
# `iosSimulatorArm64Test` is disabled off macOS with "simulator tests require macOS", and it reports
# SKIPPED rather than failing, so a green build elsewhere says nothing about iOS behaviour.
#
# Two things run here and nowhere else. The first is `:ios:shell`'s own tests - the graph, the
# history window scoping, the protection guard - which were written, passed locally, and then
# executed on no machine at all, because this file named only the three core modules. The second is
# the four platform actuals under the shared data spine. `utcOffset` is
# written to every record, takes part in contentEqualsTo and is validated by Nightscout, and it comes
# from NSTimeZone on Apple and TimeZone.getOffset on the JVM. NumberFormatParityTest and
# SystemTimeZoneTest in commonTest exist to compare them; this job is where they finally execute.
#
# No secrets: nothing is signed, published or uploaded.

on:
  workflow_dispatch:
  push:
    branches:
      - kmp-aimi-migration-study
    paths:
      - 'core/**'
      - 'database/**'
      - 'ios/**'
      - 'shared/**'
      - 'plugins/**'
      - 'implementation/**'
      - 'ui/**'
      - 'gradle/libs.versions.toml'
      - 'buildSrc/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'database/**'
      - 'ios/**'
      - 'shared/**'
      - 'plugins/**'
      - 'implementation/**'
      - 'ui/**'
      - 'gradle/libs.versions.toml'
      - 'buildSrc/**'
      # A pull request that only changes this workflow must still run it. The push
      # filter already lists the file; without this line a JDK fix here never executes.
      - '.github/workflows/ios-ci.yml'

# One job per ref. A newer run for that ref cancels the one still going.
# Branches opened as pull requests schedule pull_request only. push stays on the study branch,
# so a cursor/* head does not queue a second identical job.
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    # The suite uses about an hour. A cold TFLite 2.4.0 iossimulator-arm64
    # source build is on top of that. The static library is cached; a hit
    # skips the compile and still runs the 67 vectors.
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Android ships org.tensorflow:tensorflow-lite:2.4.0. The reference words
      # are the arm64-v8a slice of that AAR. This step runs the published 2.4.0
      # x86_64 simulator slice, one thread, no delegate. It passes only when
      # the printed gap equals the recorded x86_64-versus-arm64 table.
      - name: Compare UAM vectors with TensorFlow Lite C 2.4.0 x86_64
        run: plugins/aps/src/tfliteParity/run-uam24-x64.sh

      - name: Cache TFLite 2.4.0 iossimulator-arm64
        uses: actions/cache@v4
        with:
          path: |
            plugins/aps/build/tflite-24-sim-arm64/libtensorflow-lite.a
            plugins/aps/build/tflite-24-sim-arm64/flags.txt
            plugins/aps/build/tflite-24-sim-arm64/compile-line.txt
            plugins/aps/build/tflite-24-sim-arm64/clang-version.txt
            plugins/aps/build/tflite-24-sim-arm64/archive.sha256
          key: tflite-2.4.0-iossim-arm64-v3-${{ hashFiles('plugins/aps/src/tfliteParity/build-uam24-sim-arm64.sh', 'plugins/aps/src/tfliteParity/uam24-common.sh') }}

      # Source build of tag v2.4.0 for iossimulator-arm64. The published 2.4.0
      # framework has no such slice. A compile failure, a spawn failure, or
      # any word that differs from the Android arm64-v8a reference fails the
      # job. The gap is printed. It is not rewritten into the fixtures.
      - name: Compare UAM vectors with TFLite C 2.4.0 built for iossimulator-arm64
        run: plugins/aps/src/tfliteParity/build-uam24-sim-arm64.sh

      - name: Cache TFLite 2.4.0 iphoneos-arm64
        uses: actions/cache@v4
        with:
          path: |
            plugins/aps/build/tflite-24-device-arm64/libtensorflow-lite.a
            plugins/aps/build/tflite-24-device-arm64/flags.txt
            plugins/aps/build/tflite-24-device-arm64/compile-line.txt
            plugins/aps/build/tflite-24-device-arm64/clang-version.txt
            plugins/aps/build/tflite-24-device-arm64/archive.sha256
          key: tflite-2.4.0-iphoneos-arm64-v2-${{ hashFiles('plugins/aps/src/tfliteParity/build-uam24-device-arm64.sh', 'plugins/aps/src/tfliteParity/uam24-common.sh') }}

      # Same tag and the same parity flags, for the device SDK. The library is
      # linked below. It is not executed: this runner has no iPhone.
      - name: Build TFLite C 2.4.0 for iphoneos-arm64
        run: plugins/aps/src/tfliteParity/build-uam24-device-arm64.sh

      - name: Assert simulator and device TFLite builds use the same flags
        run: plugins/aps/src/tfliteParity/check-uam24-flags.sh

      - name: Load jdk version
        run: |
          JAVA_VERSION=$(jq -r '.default' .github/jdk-map.json)
          echo "JAVA_VERSION=$JAVA_VERSION" >> $GITHUB_ENV

      # gradle/gradle-daemon-jvm.properties (generated by updateDaemonJvm) pins the
      # daemon to JDK 21, vendor JetBrains. There is no separate Java toolchain:
      # kotlinc and javac run on that daemon JVM, which is what the green runs
      # compiled with. The vendor is the one captured from the JBR that generated
      # the file, not a bytecode flag, but dropping it would change the compiler
      # JVM. Temurin does not match, so Gradle HEADs the foojay package id baked
      # into the file. Those ids now answer 400 (macOS aarch64 and Linux x64).
      # The run on 2026-10-06 also missed the Gradle dependency cache and still
      # started, so the cache was not what kept CI green: foojay still served the
      # package. setup-java distribution 'jetbrains' installs a JBR from
      # cache-redirector.jetbrains.com and exports it as JAVA_HOME. Gradle then
      # finds a local match and does not call foojay. A second Temurin install
      # would not help: the toolcache path is not a location Gradle probes, and
      # whichever setup-java runs last owns JAVA_HOME.
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'jetbrains'
          cache: gradle

      - name: Assert the JDK is JetBrains 21
        run: |
          java -XshowSettings:properties -version 2>&1 | tee java-vendor.txt
          if ! grep -E 'java\.vendor = .*[Jj]et[Bb]rains' java-vendor.txt; then
            echo "::error::JAVA_HOME is not a JetBrains JDK. Gradle would ask foojay for one and that package id returns 400."
            exit 1
          fi
          if ! grep -E 'java\.specification\.version = 21' java-vendor.txt; then
            echo "::error::JAVA_HOME is not Java 21."
            exit 1
          fi

      # Kotlin/Native downloads its own toolchain on first use; without this every run pays for it.
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Compile the Apple targets
        run: |
          # Actions runs `bash -e` but NOT pipefail, so without this the exit code of the pipeline
          # would be tee's and a failed Gradle build would report success.
          set -o pipefail
          ./gradlew --console=plain --no-daemon \
            :core:data:compileKotlinIosArm64 :core:data:compileKotlinIosSimulatorArm64 \
            :core:nssdk:compileKotlinIosArm64 :core:nssdk:compileKotlinIosSimulatorArm64 \
            :core:keys:compileKotlinIosArm64 :core:keys:compileKotlinIosSimulatorArm64 \
            :plugins:aps:linkDebugTestIosArm64 \
            | tee compile.log

      # A disabled Kotlin/Native task reports SKIPPED and still exits 0, so "BUILD SUCCESSFUL" alone
      # would stay green even if the whole Apple side silently stopped building. Cross-compilability
      # is also transitive: a single cinterop anywhere in the project dependency graph turns these
      # into no-ops. Assert the work happened rather than that nothing complained.
      - name: Assert the Apple compiles really ran
        run: |
          if grep -E "Task :core:(data|nssdk|keys):compileKotlinIos(Arm64|SimulatorArm64) (SKIPPED|NO-SOURCE)" compile.log; then
            echo "::error::An iOS compile task was skipped instead of executed."
            exit 1
          fi
          # Device test binary of :plugins:aps. The next step proves it links
          # only the source-built iphoneos-arm64 libtensorflow-lite.a.
          # The simulator test binary links the matching iossimulator library
          # and is what iosSimulatorArm64Test executes.
          if ! grep -E "Task :plugins:aps:linkDebugTestIosArm64( |$)" compile.log | grep -vE "SKIPPED|NO-SOURCE" >/dev/null; then
            echo "::error::The device test link did not execute."
            exit 1
          fi
          for m in data nssdk keys; do
            for t in iosArm64 iosSimulatorArm64; do
              MANIFEST=$(find core/$m/build/classes/kotlin/$t/main/klib -name manifest 2>/dev/null | head -1)
              if [ -z "$MANIFEST" ]; then
                echo "::error::core/$m produced no $t klib"
                exit 1
              fi
              echo "core/$m $t -> $(grep native_targets "$MANIFEST")"
            done
          done

      - name: Prove the device test binary links only the source TFLite archive
        run: plugins/aps/src/tfliteParity/check-uam24-linked.sh device

      # The part that only exists here. commonTest runs through Kotlin/Native against the real
      # NSNumberFormatter and NSTimeZone, which is what no other host can do.
      #
      # Only :core:data has commonTest today, so it is the one module asserted below. The other two
      # are still run: if either grows shared tests later they start executing here with no change to
      # this file, and until then they are simply NO-SOURCE.
      - name: Run the shared tests on the iOS simulator
        # GitHub's macOS runners are UTC, and at UTC every assertion in SystemTimeZoneTest passes
        # trivially - the offset is zero whatever unit it is in, so a seconds-instead-of-milliseconds
        # bug in the NSTimeZone actual would sail straight through. Pin a zone that has both a
        # non-zero offset and daylight saving, so the whole-minutes, range and whole-hour-DST
        # assertions actually mean something. Foundation honours TZ on macOS, as does the JVM.
        env:
          TZ: Europe/Prague
        run: |
          set -o pipefail
          echo "Running with TZ=$TZ"
          ./gradlew --console=plain --no-daemon \
            :core:data:iosSimulatorArm64Test :core:nssdk:iosSimulatorArm64Test :core:keys:iosSimulatorArm64Test \
            :core:interfaces:iosSimulatorArm64Test \
            :core:objects:iosSimulatorArm64Test \
            :implementation:iosSimulatorArm64Test :ios:shell:iosSimulatorArm64Test \
            :plugins:aps:iosSimulatorArm64Test \
            | tee test.log

      # Every module that HAS iOS tests is checked by name. A module added to the run above but not
      # to this list would be free to go SKIPPED again without anyone noticing, which is exactly how
      # `:ios:shell` came to have eleven tests that no machine executed.
      - name: Assert the iOS tests really ran
        run: |
          fail=0
          check() {
            local gradle_path="$1" dir="$2"
            if grep -E "Task $gradle_path:iosSimulatorArm64Test (SKIPPED|NO-SOURCE)" test.log; then
              echo "::error::$gradle_path had its iOS tests skipped instead of executed. On macOS they must run."
              fail=1
              return
            fi
            FOUND=$(find "$dir/build/test-results/iosSimulatorArm64Test" -name "TEST-*.xml" 2>/dev/null | wc -l)
            echo "iOS test result files for $gradle_path: $FOUND"
            if [ "$FOUND" -le 0 ]; then
              echo "::error::$gradle_path produced no iOS test results."
              fail=1
              return
            fi
            # Surface the counts, so a run that executed zero assertions is visible in the log.
            grep -ho 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' \
              "$dir"/build/test-results/iosSimulatorArm64Test/TEST-*.xml || true
          }
          check ":core:data" core/data
          check ":implementation" implementation
          check ":ios:shell" ios/shell
          # :core:interfaces has commonTest (BleSessionTest). Without this line a SKIPPED
          # iosSimulatorArm64Test still exits 0 and the module disappears.
          check ":core:interfaces" core/interfaces
          # :core:objects commonTest holds LinkCryptoVectorsTest and LinkCryptoAesVectorsTest.
          # Without this line a SKIPPED iosSimulatorArm64Test still exits 0 and the module disappears.
          check ":core:objects" core/objects
          check ":plugins:aps" plugins/aps
          exit $fail

      - name: Prove the simulator test binary links only the source TFLite archive
        run: plugins/aps/src/tfliteParity/check-uam24-linked.sh simulator

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            core/*/build/test-results/iosSimulatorArm64Test/**
            implementation/build/test-results/iosSimulatorArm64Test/**
            ios/shell/build/test-results/iosSimulatorArm64Test/**
            plugins/aps/build/test-results/iosSimulatorArm64Test/**
          if-no-files-found: warn
