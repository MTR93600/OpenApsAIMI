name: Auto Sync Upstream Branch

on:
  schedule:
- cron: '0 19 * * *'
workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev_OAPSAIMI
          fetch-depth: 0
      - name: Sync with upstream
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/MTR93600/OpenApsAIMI.git
          git fetch upstream dev_OAPSAIMI
          git checkout dev_OAPSAIMI
          git merge upstream/dev_OAPSAIMI --no-edit || true
          git push origin dev_OAPSAIMI
