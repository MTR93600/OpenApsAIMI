		AA2000900000000000000 /* Build shared framework */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputPaths = (
			);
			name = "Build shared framework";
			outputPaths = (
				"$(SRCROOT)/../../plugins/aps/build/tflite-24-$(AAPS_TFLITE_KIND)-arm64/libtensorflow-lite.a",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\n# Without this the phase cannot fail. Xcode runs it with /bin/sh, and the gradle call below\n# is not the last command - the alarm-sound copy follows it - so the phase used to exit with\n# the copy's status. A failing gradle was invisible and Xcode linked whatever framework was\n# already on disk, which means a build could ship a stale Kotlin engine while looking fresh.\n# Keep the framework in step with the Kotlin sources.\n# The simulator and a real phone are different architectures, so the Gradle target follows\n# whatever Xcode is building rather than being fixed to one of them.\ncase \"$PLATFORM_NAME\" in\n  iphonesimulator) KOTLIN_TARGET=IosSimulatorArm64 ;;\n  iphoneos)        KOTLIN_TARGET=IosArm64 ;;\n  *) echo \"error: unsupported platform $PLATFORM_NAME\" >&2; exit 1 ;;\nesac\n# TensorFlow Lite C for the UAM model: the app links this archive (OTHER_LDFLAGS). It is not in git,\n# so it is built once, from the pinned TensorFlow 2.4 source, when it is not there yet.\ncase \"$PLATFORM_NAME\" in\n  iphonesimulator) TFLITE_KIND=sim ;;\n  *)               TFLITE_KIND=device ;;\nesac\nif [ ! -f \"$SRCROOT/../../plugins/aps/build/tflite-24-$TFLITE_KIND-arm64/libtensorflow-lite.a\" ]; then\n  \"$SRCROOT/../../plugins/aps/src/tfliteParity/build-uam24-$TFLITE_KIND-arm64.sh\"\nfi\n# Xcode does not inherit a login shell, so JAVA_HOME is set here rather than assumed.\nexport JAVA_HOME=\"$(/usr/libexec/java_home -v 21)\"\n# Debug or Release Kotlin, following what Xcode is building. Pinned to Debug before, which meant an\n# archive for TestFlight shipped unoptimised Kotlin - the whole app logic - while everything\n# around it was built as a release.\ncase \"$CONFIGURATION\" in\n  Release) KOTLIN_BUILD=Release ;;\n  *)       KOTLIN_BUILD=Debug ;;\nesac\n# A fresh clone has no Version.xcconfig, so Xcode falls back to the project defaults and the app\n# calls itself 1.0 (1). Crashlytics sorts everything by version, so every self-builder would\n# land in one bucket and one person building 200 times would look like 200 users.\n# Written only when it is missing, not on every build: an xcconfig that changes each time\n# invalidates the build settings and forces a full rebuild. CI runs the task itself before\n# archiving, which is what keeps the TestFlight build number going up.\nif [ ! -f \"$SRCROOT/Version.xcconfig\" ]; then\n  \"$SRCROOT/../../gradlew\" -p \"$SRCROOT/../..\" :ios:shell:generateIosVersionXcconfig --no-daemon\nfi\n# The Release link of the Kotlin framework (an archive) needs more heap than the 8 GB of\n# gradle.properties: it failed with \"Java heap space\" in linkReleaseFrameworkIosArm64.\n# Only the Release link gets more; Debug keeps the project setting.\nif [ \"$KOTLIN_BUILD\" = Release ]; then\n  \"$SRCROOT/../../gradlew\" -p \"$SRCROOT/../..\" \":ios:shell:link${KOTLIN_BUILD}Framework$KOTLIN_TARGET\" --no-daemon \"-Dorg.gradle.jvmargs=-Xmx14g -XX:+UseParallelGC -Xss4m\"\nelse\n  \"$SRCROOT/../../gradlew\" -p \"$SRCROOT/../..\" \":ios:shell:link${KOTLIN_BUILD}Framework$KOTLIN_TARGET\" --no-daemon\nfi\n\n# The alarm sounds live once, in :core:ui's Android resources. Copying them at build time rather\n# than keeping a second set under ios/ means the two cannot drift - a replaced alarm tone stays one\n# edit, not two.\nSOUNDS=\"$SRCROOT/../../core/ui/src/androidMain/res/raw\"\nDEST=\"$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH\"\nmkdir -p \"$DEST\"\nfor s in alarm urgentalarm error boluserror eatreminder; do\n  if [ ! -f \"$SOUNDS/$s.mp3\" ]; then\n    echo \"error: alarm sound $s.mp3 missing from $SOUNDS\" >&2; exit 1\n  fi\n  cp \"$SOUNDS/$s.mp3\" \"$DEST/\"\ndone\n# The Trio sounds of the CGM alarms (see core/ui/SOUNDS.md). AlarmSound names each one, so a\n# missing file would make that alarm fall back to the iOS sound without a word.\nset -- \"$SOUNDS\"/trio_*.m4a\nif [ ! -f \"$1\" ]; then\n  echo \"error: Trio alarm sounds missing from $SOUNDS\" >&2; exit 1\nfi\ncp \"$@\" \"$DEST